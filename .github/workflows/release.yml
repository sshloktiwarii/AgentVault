name: AgentVault Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_name: agentvault-linux-amd64.tar.gz
            bin_name: agentvault
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_name: agentvault-linux-arm64.tar.gz
            bin_name: agentvault
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_name: agentvault-darwin-amd64.tar.gz
            bin_name: agentvault
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_name: agentvault-darwin-arm64.tar.gz
            bin_name: agentvault
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_name: agentvault-windows-amd64.zip
            bin_name: agentvault.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux targets)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Compile release binary (with cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Compile release binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Package release artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Publish GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
