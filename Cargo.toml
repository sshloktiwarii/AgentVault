[package]
name = "agentvault"
version = "4.0.0"
edition = "2021"
authors = ["Shlok Tiwari <73051529+Shlok04423@users.noreply.github.com>"]
description = "AgentVault: Production-grade local-first transaction layer and flight recorder for autonomous AI coding agents"
license = "MIT"
repository = "https://github.com/Shlok04423/agentvault"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
portable-pty = "0.8"
notify = "6.1"
git2 = { version = "0.19", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dunce = "1.0"
crossbeam-channel = "0.5"
zstd = "0.13"
strip-ansi-escapes = "0.2"
regex = "1.10"
ignore = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "agentvault"
path = "src/main.rs"

[lib]
name = "agentvault"
path = "src/lib.rs"
